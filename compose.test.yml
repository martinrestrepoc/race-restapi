name: race-management-test

services:
  postgres-test:
    image: postgres:16
    environment:
      POSTGRES_DB: race_db_test
      POSTGRES_USER: race_test
      POSTGRES_PASSWORD: race_test
    ports:
      - "127.0.0.1:${TEST_POSTGRES_HOST_PORT:-5434}:5432"
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U race_test -d race_db_test"]
      interval: 2s
      timeout: 3s
      retries: 15
      start_period: 3s
